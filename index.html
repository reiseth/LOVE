<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Riot&display=swap"

    <link rel="stylesheet" href="style.css" />

      <img class="cat-img" src="img/cat-0.jpg" alt="Picture of a cat" />

      <link rel="cat-image" href="img/cat-7.jpg" />
      <link rel="cat-image" href="img/cat-8.jpg" />
      <link rel="cat-image" href="img/cat-9.jpg" />
      <link rel="cat-image" href="img/cat-10.jpg" />
      <p class="title">Will you be my girlfriend?</p>
      <div class="buttons">
        <button type="button" class="btn btn--yes">Yes</button>
        <button type="button" class="btn btn--no">No</button>
      </div>

    <script type="module" src="script.js"></script>
